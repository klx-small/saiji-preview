name: Publish Saiji public Demo

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'klx-small/saiji-preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed static artifacts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Package static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # The action excludes .git and .github from its archive.
          path: '.'
          retention-days: 1
      - name: Deploy reviewed static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
